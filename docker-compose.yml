services:
  web-prototype:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web-prototype-node-modules:/app/node_modules

  android-build:
    build:
      context: .
      dockerfile: Dockerfile.android
    volumes:
      - .:/app
      - ./build-output:/app/build-output
    # Optional release signing (see .signing/README.md); unset = debug build
    environment:
      - ANDROID_KEYSTORE_FILE
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
      - ANDROID_KEY_PASSWORD

volumes:
  web-prototype-node-modules:
